plugins {
    alias(libs.plugins.java)
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        url = uri('https://repository.aspose.com/repo/')
    }

    maven {
        url = uri("D:/prj/aspose/libs/aspose-md-html")
    }
}

java {
    sourceCompatibility = "1.8"
    targetCompatibility = "${JAVA_VERSION}"
    toolchain {
        languageVersion = JavaLanguageVersion.of("${JAVA_VERSION}")
    }
}

dependencies {
//    implementation("com.aspose.html:aspose-html:26.8-M6-20260705110550:jdk8-obfuscated")
    implementation("com.aspose.html:aspose-html:26.8-M6-20260706093853:jdk8-obfuscated")

//    implementation(libs.aspose.html) {
//        artifact {
//            classifier = "jdk${JAVA_VERSION}"
//        }
//    }

    implementation(
            libs.commons.lang3,
            libs.bundles.junit
    )
}

tasks.register('SimpleWait', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.aspose.html.examples.SimpleWait'
}

test {
    description = 'Runs the tests in the examples source set'
    group = 'verification'
    testClassesDirs = sourceSets.main.output.classesDirs
    classpath = sourceSets.main.runtimeClasspath
    useJUnitPlatform() // Enables JUnit 5 (Jupiter)
    maxParallelForks = Runtime.runtime.availableProcessors()
    testLogging.showStandardStreams = false
}